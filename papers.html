olid #e2e8f0;margin-top:20px;font-size:1.05rem}@media (max-width:768px){nav ul{flex-wrap:wrap}nav li{margin:5px}h1{font-size:2.3rem}.subtitle{font-size:1.2rem}}

<body>
  <header>
    <h1>Minecraft日记</h1>

  <nav>

  <div class="container">
    <h2 class="section-title">IMC篇</h2>
    <h3 class="subtitle">作者lic</h3>
    <div class="content-box">
      <h3 id="paper-text">敬请期待</h3>
    </div>
    
    <div class="pagination">
      <button id="prev-btn" disabled><i class="fas fa-arrow-left"></i> 上一页</button>
      <button id="next-btn">下一页 <i class="fas fa-arrow-right"></i></button>
    </div>
    <div class="page-info">第 <span id="current-page">1</span> 页 / 共 5 页</div>
  </div>
  
  <footer>
    <p>© MC༒狂爱者基地 于2026年5月24日编辑</p>
  </footer>

 <script>
    const papers = [
      `&emsp;&emsp;等了好久，IMC的多人联机功能又好了，不知道为什么，有时候会突然不能用，但在别的地区能用。翻了一下列表，大部分都是生存和PVP，由于是手机版，pvp不好打,生存我又觉得不好玩，这时，一个叫so easy的标题吸引了我,so easy?能有多easy?进去一看,果然是个跑酷,手机玩跑酷有天生的优势,开始都挺简单的,给我开心的不停在聊天群里发so easy,结果一会就打脸了。被一个旋转跳难住了,头顶还有个石头,只好叫房主来帮忙了，房主叫food,后来我们就一起跑酷了,很多关卡都跳过了,那个旋转跳实在是过不去,班实力有限，最后终于到终点了，我们坐上了矿车，浏览了一遍地图，跑了我两个小时(°ー°〃)。<br>&emsp;&emsp;后来他就把我拉去了他的另一个服，是一个创造世界，他在里面建了一个召唤him的东西，我开个玩笑说了句:him来了！结果刚说完，真有一个叫HIM的玩家加入了，说了句hi,我俩都搁那蒙了半天,他说:"还能这么玩？"我又开始做末地传送门,做好之后把传送方块拆的只剩一个，再把周围围上，就做成了一个只有一格的末地传送门，还搞了一个天堂传送门和一个暮色传送门，当然都是假的（除了那个召唤HIM的qwq）<br>&emsp;&emsp;我用沙子搭了一个陷阱，但是太假了，于是我又弄了个商店，在商店门前用告示牌弄了个坑，上面铺上了地毯，接着跟全服人说:"来我这商店买东西的有福利"好多人来了都没发现门口的地毯有什么问题,然后我在商店内部把告示牌一拆,人全掉下去了qwq,就这样成全服公敌了,后来我就退了(我还发现了怎么发变色字体的方法:在聊天栏里输&+任意数字+要发的字,还有如何私信一个人:/tell 玩家名 内容)。`,
      `&emsp;&emsp;今天进了一个叫钻石大陆的服务器，开始挖了好多钻石，换了一把钻镐，然后又买了效率5，时运3，这时屏幕上突然显示某个坐标有大奖，可我是手机，看不清具体坐标，只看得见x坐标，我就在z坐标的一个方向跑,找到一个村庄,什么也没发现,然后被僵尸打死了,回到主城,我用钻石兑换钻石块,32个钻石换一个钻块，太坑了(。_。)，但货币就是钻块，没办法。我突然想到了村庄，村庄里有工作台，刚准备去，服主帮我叫了过去，送了我一把效率10，时运5的钻镐，随后我跑到了村庄，先挖了9组钻石，然后全合成钻块。买了一个钻剑，再合成了钻石装备，服主还惊讶我怎么挖那么快😂<br>&emsp;&emsp;又遇到food的服了，不过他的服已经被人炸的不成样子了，他向我抱怨了一句就关服了<br>&emsp;&emsp;后来进了一个叫ren的人创建的PVP服，里面有个跑酷，不知道今天怎么了，一遍就过了😮，他邀请我做管理员，但他一直弄不好命令方块，最终也没当上管理员。`,
      `&emsp;&emsp;进了一个叫2b2t（假的）的服务器,刚进去我居然发现手上有tnt,tnt矿车以及一些红石,我突然想起来之前有一次也是2b2t,不过是腐竹让我帮他炸服,看来这就是我帮他炸的那个服，右侧公告栏还有一个显示，随意开挂，那我可就不客气了，我把下好的矿透材质包装了进去，然后远离出生点，开始下矿，脚下就是钻石，但我还没挖铁，我突发奇想，拿了个tnt炸钻石，可惜只掉了两颗，然后我又想用tnt矿车，却发现铁轨不见了，我依稀记得我把铁轨给扔了，但我捡起来了，不过我扔到了一个传送门里，我没注意捡没捡到，很有可能是传到下界去了，只好正常发育了，没多久就凑齐了钻套，我找了一个人跟他结盟，我们向出生点之外跑，跑了1000多格我就下线了。`,
      `&emsp;&emsp;再次回到了服务器，我挖了很多钻石，然后找了几个人结盟，他们说直接从下界之顶赶路到主世界1万格，不过我们只到了8000个就停了，我们几个建了个小房子，开了一大块田，以及一片小甘蔗地，钻石储备也越来越多，我们把自己的名牌挂在房子上，现在共有6个人，期间我就出去闲逛，发现了不少藏在山里和地下的基地，虽然都没什么好东西，至少有两附魔台，我们又圈了块地养牛，并在房子底下挖了个地方放附魔台，没过几天又加了一个人，他直接把附魔台全补完了，我严重怀疑他开了，而且我找他要羊毛，他直接给一组，他说他是老玩家（谁信啊）🙃。`,
      `&emsp;&emsp;依旧是2b2t,不过这回我开始研究别的了,既然服务器说随意作弊,那我肯定不能只满足于矿透,我注意到一个管理员叫him1,我想着盗他的号，然后给我op权限,但却发现设了密码,不登录无法使用指令，且无法移动,但我能打开背包,同时我也发现，如果局域网世界未开启打开作弊是不能给予一个玩家op权限的,于是我把目标转向了创造,我曾问过腐竹还记不记得我？他说记得,我想我可以套一下关系,看他能不能给我个命令方块,毕竟生存也用不了，创造也用不了,我就说是装饰品，他应该不会怀疑<br>&emsp;&emsp;同时我发现主城有一个村民卖东西,有下界之星和恶魂之泪这两个东西能兑换随机物品,同时还有一把神剑,一件几十伤害,我利用him1的账号刷了一些绿宝石，成功凑齐了不死图腾（假的），秒人斧，烈焰蛋，以及一大堆神级药水，还有那个神剑，我发现还卖一些刷怪蛋,但我并没在意,直到我无意间发现了家底下有一个地牢,我就把它改造成了一个刷小黑的,只不过目前还没改刷的怪,现在刷的还是蜘蛛。`,
    ];
    
    let page = 0;
    const textEl = document.getElementById('paper-text');
    const prev = document.getElementById('prev-btn');
    const next = document.getElementById('next-btn');
    const curr = document.getElementById('current-page');
    
    function update() {
      // 关键修改在这里：
      // 原来的 textContent 只显示文字；
      // 现在的 innerHTML 会解析 HTML 标签（如 <br>）
      textEl.innerHTML = papers[page]; 
      
      curr.textContent = page + 1;
      prev.disabled = page === 0;
      next.disabled = page === papers.length - 1;
    }
    
    prev.addEventListener('click', () => { if(page>0) { page--; update(); } });
    next.addEventListener('click', () => { if(page<papers.length-1) { page++; update(); } });
    
    update();
</script>
</body>
</html>
